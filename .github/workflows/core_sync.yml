name: Core System Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Initialization
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASE="https://api.github.com/repos/${OWNER}/${REPO}/traffic"
      
          for kind in metrics_a metrics_b; do
            curl --globoff \
                 -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
                 -H "Accept: application/vnd.github+json" \
                 "$BASE/$kind" > "${kind}.json"
          done
      
          jq -n \
            --slurpfile metrics_a metrics_a.json \
            --slurpfile metrics_b metrics_b.json \
            '{
              a_total:   $metrics_a[0].count,
              a_unique:  $metrics_a[0].uniques,
              b_total:   $metrics_b[0].count,
              b_unique:  $metrics_b[0].uniques
            }' > data_blob.json


      - name: Data Deployment
        run: |
          git clone "https://${{ secrets.TRAFFIC_TOKEN }}@github.com/${{ github.repository_owner }}/ci-environment-logs.git" archive
          mkdir -p archive/logs
          mv data_blob.json archive/logs/log_$(date +%Y%m%d).json
          cd archive
          git config user.email "action@github.com"
          git config user.name "system-agent"
          git add .
          git commit -m "sys: $(date +%Y%m%d)" || echo "No changes"
          git push
