name: Core System Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Initialization
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASE="https://api.github.com/repos/${OWNER}/${REPO}/traffic"

          for kind in views clones "popular/referrers" "popular/paths"; do
            out=$(echo "$kind" | tr '/' '_')
            curl --globoff \
                 -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
                 -H "Accept: application/vnd.github+json" \
                 "$BASE/$kind" > "${out}.json"
          done

          jq -n \
            --slurpfile views views.json \
            --slurpfile clones clones.json \
            --slurpfile referrers popular_referrers.json \
            --slurpfile paths popular_paths.json \
            '{views: $views[0], clones: $clones[0], referrers: $referrers[0], paths: $paths[0]}' \
            > data_blob.json

      - name: Data Deployment
        run: |
          git clone "https://${{ secrets.TRAFFIC_TOKEN }}@github.com/${{ github.repository_owner }}/ci-environment-logs.git" archive
          mkdir -p archive/logs
          mv data_blob.json archive/logs/log_$(date +%Y%m%d).json
          cd archive
          git config user.email "action@github.com"
          git config user.name "system-agent"
          git add .
          git commit -m "sys: $(date +%Y%m%d)" || echo "No changes"
          git push
